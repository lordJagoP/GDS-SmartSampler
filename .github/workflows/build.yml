name: Build

on:
  push:
    branches: [main, kali-linux-port]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libglu1-mesa-dev mesa-common-dev libegl-dev
      - name: Configure
        run: cmake -S Source -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSMARTSAMPLER_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2 --target SmartSampler_VST3 SmartSampler_Standalone SmartSamplerFX_VST3 SmartSamplerFX_Standalone SmartSamplerTests SmartSamplerFXTests
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S Source -B build -A x64 -DSMARTSAMPLER_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2 --target SmartSampler_VST3 SmartSampler_Standalone SmartSamplerFX_VST3 SmartSamplerFX_Standalone SmartSamplerTests SmartSamplerFXTests
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Windows bundles
        shell: pwsh
        run: |
          Compress-Archive -Path "build/SmartSampler_artefacts/Release/VST3/SmartSampler.vst3", "build/SmartSamplerFX_artefacts/Release/VST3/SmartSampler FX.vst3" -DestinationPath "build/SmartSampler-Windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: SmartSampler-Windows-x64
          path: build/SmartSampler-Windows-x64.zip
